[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adapters"
version = "0.1.0"
description = "Hardware, sensor, propulsion, FMS-link and simulation adapters for the AI Box"
requires-python = ">=3.10"
dependencies = ["marine-contracts", "ai-box", "pydantic>=2.5,<3"]

[tool.setuptools.packages.find]
where = ["src"]
