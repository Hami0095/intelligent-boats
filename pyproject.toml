[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.10"
files = [
    "ai-box/src",
    "fms/src",
    "interfaces/src",
    "adapters/src",
]
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
