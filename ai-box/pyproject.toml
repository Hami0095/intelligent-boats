[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-box"
version = "0.1.0"
description = "Onboard software environment of the autonomous marine system"
requires-python = ">=3.10"
dependencies = ["marine-contracts", "pydantic>=2.5,<3"]

[tool.setuptools.packages.find]
where = ["src"]
