[pytest]
# Makes every package importable from a source checkout, without installing.
pythonpath =
    interfaces/src
    ai-box/src
    fms/src
    adapters/src
testpaths =
    tests
    ai-box/tests
    fms/tests
    adapters/tests
# Each test directory may contain files with the same basename; importlib avoids collisions.
addopts = --import-mode=importlib -ra
