[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fms"
version = "0.1.0"
description = "Fleet Management System foundation: boat identities, message handling, mission dispatch"
requires-python = ">=3.10"
dependencies = ["marine-contracts", "pydantic>=2.5,<3"]

[tool.setuptools.packages.find]
where = ["src"]
