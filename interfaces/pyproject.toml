[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-contracts"
version = "1.0.0"
description = "Versioned, transport-independent message contracts for the autonomous marine system"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5,<3"]

[tool.setuptools.packages.find]
where = ["src"]
